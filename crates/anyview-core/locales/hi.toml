"Anyview portable: while this file is here, settings, recent files and archive positions are kept in the data folder next to it, and nothing is written to the system. To remove Anyview, delete the whole folder; nothing is left behind. If you delete this file, Anyview uses your user folder instead." = "Anyview पोर्टेबल: जब तक यह फ़ाइल यहाँ है, सेटिंग्स, हाल की फ़ाइलें और आर्काइव में देखी गई जगह पास के data फ़ोल्डर में रखी जाती हैं, और सिस्टम में कुछ नहीं लिखा जाता। Anyview हटाना हो तो पूरा फ़ोल्डर मिटा दें; कुछ भी बचा नहीं रहेगा। यह फ़ाइल हटाने पर Anyview आपके उपयोगकर्ता फ़ोल्डर का उपयोग करेगा।"
