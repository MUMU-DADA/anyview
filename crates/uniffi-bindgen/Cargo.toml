[package]
name = "uniffi-bindgen"
description = "生成 Swift/C# 绑定的 UniFFI 命令行工具（只在构建时使用）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "uniffi-bindgen"
path = "src/main.rs"

[dependencies]
uniffi = { workspace = true, features = ["cli"] }
