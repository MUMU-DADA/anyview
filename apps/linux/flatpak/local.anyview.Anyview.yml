# Anyview Flatpak manifest. Build offline via tools/linux/flatpak/build.sh.
id: local.anyview.Anyview
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: anyview

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  # GPU acceleration for GTK 4 rendering.
  - --device=dri
  # Page-turn sound effect playback.
  - --socket=pulseaudio
  # Host filesystem access for browsing sibling images, external drives, and user-initiated file operations.
  - --filesystem=host

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/anyview/cargo-home
    CARGO_NET_OFFLINE: 'true'

modules:
  - name: anyview
    buildsystem: simple
    build-commands:
      # Offline build using pre-vendored Cargo dependencies.
      - mkdir -p .cargo && printf '[source.crates-io]\nreplace-with = "vendored-sources"\n\n[source.vendored-sources]\ndirectory = "vendor"\n' > .cargo/config.toml
      - cargo --offline build --release --locked -j "${FLATPAK_BUILDER_N_JOBS}" -p anyview-linux
      - install -Dm755 target/release/anyview /app/bin/anyview
      - ./target/release/anyview --print-desktop-entry > local.anyview.Anyview.desktop
      - install -Dm644 local.anyview.Anyview.desktop /app/share/applications/local.anyview.Anyview.desktop
      - mkdir -p /app/share/icons && cp -r apps/linux/data/icons/hicolor /app/share/icons/
      - install -Dm644 apps/linux/data/mime/local.anyview.Anyview.xml /app/share/mime/packages/local.anyview.Anyview.xml
      - install -Dm644 LICENSE /app/share/licenses/local.anyview.Anyview/LICENSE
      - install -Dm644 crates/anyview-core/licenses/linux.txt /app/share/licenses/local.anyview.Anyview/THIRD-PARTY-NOTICES.txt
    sources:
      - type: dir
        path: ../../..
        skip:
          - .git
          - target
          - out
          - reports
          - tests
      - type: dir
        path: ../../../out/flatpak/vendor
        dest: vendor
