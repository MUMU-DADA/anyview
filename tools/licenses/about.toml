# cargo-about 0.9.3 的设置：tools/licenses/generate.sh 用它列出编进程序的 Rust 库和它们的许可证。
# 一个库有几种许可证可选（如 "MIT OR Apache-2.0"）时，按这里的先后选第一种认得的。
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "CC0-1.0",
    "MIT-0",
    "0BSD",
    "Unlicense",
    "bzip2-1.0.6",
    "BSL-1.0",
]
# 只列装进程序的：编译时才用的库（过程宏、构建脚本）和测试用的不列。
ignore-build-dependencies = true
ignore-dev-dependencies = true
# Anyview 自己的 crate（都标了 publish = false）不列；编进 anyview-libraw、anyview-jxr 的 LibRaw、jxrlib 在 generate.py 里另写。
private = { ignore = true }
